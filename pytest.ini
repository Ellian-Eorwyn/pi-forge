[pytest]
# Test files are named after the module they cover, and lib and skills both have
# a vault_wiki, so basenames collide. Under pytest's default import mode a
# collision is a collection error that stops the whole suite, not just the two
# files -- and each file still passes when run on its own, so the break is easy
# to miss. importlib mode imports by location and does not care about basenames.
addopts = --import-mode=importlib
